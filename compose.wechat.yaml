# WeChat IM integration overlay for the Super Agent project. Use it on top of both
# existing files, keeping their volumes and services:
#
#   export DOCKER_HOST=tcp://10.16.217.162:2376 DOCKER_TLS_VERIFY=1 DOCKER_CERT_PATH=/Users/zhaofa/.docker
#   docker compose -p dsh-superagent -f compose.yaml -f compose.superagent.yaml -f compose.wechat.yaml up -d
#
# One image, two containers. The Bridge publishes no host port: DSH reaches it as
# http://wechat-bridge:8787 on the project network. The Bridge generates a dedicated token on
# the shared volume on first start; it is never the DSH launch token.
x-wechat-image: &wechat-image ${DSH_IMAGE_REPOSITORY:-ghcr.io/javader/deepseek-harness}:${WECHAT_IMAGE_VERSION:-0.2.2-rc.2-r3-superagent-wechat.2}

services:
  deepseek-harness:
    build:
      dockerfile: Dockerfile.superagent-wechat
      args:
        SUPERAGENT_IMAGE: docker.io/runzhliu/deepseek-harness:${SUPERAGENT_IMAGE_VERSION:-0.2.2-rc.2-r3-superagent.1}
    image: *wechat-image
    environment:
      WECHAT_BRIDGE_URL: http://wechat-bridge:8787
      WECHAT_BRIDGE_TOKEN_FILE: /run/secrets/wechat-bridge-token
    volumes:
      - wechat-bridge-secrets:/run/secrets:ro
    depends_on:
      wechat-bridge:
        condition: service_healthy

  wechat-bridge:
    image: *wechat-image
    entrypoint: ["node", "/opt/dsh-wechat-bridge/src/main.js"]
    command: []
    user: node
    environment:
      WECHAT_PROVIDER: ${WECHAT_PROVIDER:-mock}
      WECHAT_ALLOWED_SENDERS: ${WECHAT_ALLOWED_SENDERS:-}
      WECHAT_GROUPS_ENABLED: ${WECHAT_GROUPS_ENABLED:-0}
      WECHAT_BRIDGE_TOKEN_FILE: /run/secrets/wechat-bridge-token
      WECHAT_BRIDGE_DATA: /data
    volumes:
      - wechat-bridge-data:/data
      # The Bridge creates the token here on first start; DSH mounts the same volume read-only.
      - wechat-bridge-secrets:/run/secrets
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: unless-stopped
    # No published port, no Docker socket, no DSH volumes: the Bridge cannot touch DSH state or the host.

volumes:
  wechat-bridge-data:
  wechat-bridge-secrets:
