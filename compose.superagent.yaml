# Run as a separate project: docker compose -p dsh-superagent -f compose.yaml -f compose.superagent.yaml up -d --no-build
services:
  deepseek-harness:
    build:
      dockerfile: Dockerfile.superagent
      args:
        BASE_IMAGE: ${DSH_IMAGE_REPOSITORY:-docker.io/runzhliu/deepseek-harness}:${MARKET_IMAGE_VERSION:-0.2.2-rc.2-r1-market.1}
        SUPERAGENT_IMAGE_VERSION: ${SUPERAGENT_IMAGE_VERSION:-0.2.2-rc.2-r3-superagent.1}
    image: ${DSH_IMAGE_REPOSITORY:-docker.io/runzhliu/deepseek-harness}:${SUPERAGENT_IMAGE_VERSION:-0.2.2-rc.2-r3-superagent.1}
    environment:
      DSH_SUPERAGENT_PUBLIC_PORT: ${DSH_PORT:-3080}
      # Exact HTTPS origin; leave empty for loopback-only management APIs.
      DSH_SUPERAGENT_TRUSTED_ORIGIN: ${DSH_SUPERAGENT_TRUSTED_ORIGIN:-}
      # Public HTTPS Caddy serves /novnc-* on the same origin; do not expose :6082 directly.
      DSH_DESKTOP_PUBLIC_PORT: ${DSH_DESKTOP_PUBLIC_PORT:-443}
    volumes:
      - dsh-superagent-home:/home/node/.dsh
      - ${DSH_SUPERAGENT_WORKSPACE:-dsh-superagent-workspace}:/workspace

volumes:
  dsh-superagent-home:
  dsh-superagent-workspace:
