name: Publish WeChat images

on:
  push:
    branches: [main]
    paths:
      - integrations/wechat/**
      - Dockerfile.superagent-wechat
      - Dockerfile.superagent
      - superagent/**
      - .github/workflows/publish-wechat.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wechat-image-release
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/javader/deepseek-harness
  TAG: 0.2.2-rc.2-r3-superagent-wechat.2

jobs:
  platform:
    name: Build and push (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test "integrations/wechat/*.test.js"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse immutable tag overwrite
        run: |
          for t in "$TAG" "$TAG-${{ matrix.arch }}"; do
            if docker buildx imagetools inspect "$GHCR_IMAGE:$t" >/dev/null 2>&1; then
              echo "refusing to overwrite $GHCR_IMAGE:$t" >&2; exit 1
            fi
          done
      - name: Build
        # The WeChat layer must sit on the current Super Agent (r3 auth/same-origin patch), built from this commit.
        run: |
          docker build --builder default -f Dockerfile.superagent --build-arg SUPERAGENT_IMAGE_VERSION=0.2.2-rc.2-r3-superagent.1 --build-arg IMAGE_REVISION=${{ github.sha }} -t localhost/superagent .
          docker build --builder default -f Dockerfile.superagent-wechat --build-arg SUPERAGENT_IMAGE=localhost/superagent -t sa .
          node scripts/superagent-smoke.cjs sa
      - name: Smoke
        run: |
          docker volume create wb-secrets && docker volume create wb-data
          docker run -d --name wb --read-only -v wb-secrets:/run/secrets -v wb-data:/data --entrypoint node sa /opt/dsh-wechat-bridge/src/main.js
          sleep 5
          docker exec wb node -e "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1))"
          docker exec wb node -e "fetch('http://127.0.0.1:8787/v1/status').then(r=>process.exit(r.status===401?0:1))"
          docker run --rm -v wb-secrets:/run/secrets:ro --entrypoint sh sa -c 'test -s /run/secrets/wechat-bridge-token && DSH_HOME=/opt/deepseek-harness/superagent-template dsh web --dump-config 2>&1 | grep -q "id: dsh-superagent-wechat"'
      - name: Push platform images
        run: |
          docker tag sa "$GHCR_IMAGE:$TAG-${{ matrix.arch }}" && docker push "$GHCR_IMAGE:$TAG-${{ matrix.arch }}"

  manifest:
    name: Publish multi-platform manifests
    needs: platform
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create --tag "$GHCR_IMAGE:$TAG" "$GHCR_IMAGE:$TAG-amd64" "$GHCR_IMAGE:$TAG-arm64"
